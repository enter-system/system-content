<!doctype html>
<!-- One 1080x1920 slide for The System's faceless posts. render.cjs calls show(slide) for each slide.
     A slide is { kind: 'cover'|'point'|'math'|'countdown'|'cta'|'whisper'|'essay'|'logo', ...text, bg?: 'photos/library/x.jpg', tone?: 'red'|'gold'|'alert', banner?: 'DON\'T SCROLL PAST THIS' }.
     countdown: { big: '50', title: 'DAYS LEFT IN 2026', sub }.
     whisper: { bg (required), text: 'rich.', y?: 34 (% from top), font?: 'serif'|'sans', cap?: 'THE SYSTEM · COMING SOON' } — no grid, no banner.
     Text fields accept a little HTML: <b> makes words cyan. -->
<html><head><meta charset="utf-8"><style>
@font-face { font-family: Raj; src: url(fonts/rajdhani-latin-600-normal.woff2); font-weight: 600; }
@font-face { font-family: Raj; src: url(fonts/rajdhani-latin-700-normal.woff2); font-weight: 700; }
html,body{margin:0;width:1080px;height:1920px;overflow:hidden}
#s{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Raj,sans-serif;color:#e8f1fb;background:radial-gradient(ellipse at 50% 42%,#10223f 0%,#070b14 60%,#04060c 100%)}
#bg{position:absolute;inset:0;background-size:cover;background-position:center;display:none}
#bg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,6,12,.55) 0%,rgba(4,6,12,.72) 45%,rgba(4,6,12,.9) 100%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(94,231,255,.07) 2px,transparent 2px),linear-gradient(90deg,rgba(94,231,255,.07) 2px,transparent 2px);background-size:90px 90px}
.photo .grid{opacity:.35}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 2px,transparent 2px 6px)}
.wrap{position:absolute;left:90px;right:90px;top:330px;bottom:420px;display:flex;flex-direction:column;justify-content:center;gap:44px}
.kick{font-weight:700;font-size:46px;letter-spacing:.32em;color:#f5c451;text-shadow:0 0 24px rgba(245,196,81,.5)}
.h{font-weight:700;font-size:124px;line-height:.98;letter-spacing:.01em;text-shadow:0 4px 30px rgba(0,0,0,.6)}
.h b,.c,.p b{color:#5ee7ff;text-shadow:0 0 36px rgba(94,231,255,.7)}
.box{border:3px solid rgba(94,231,255,.75);background:rgba(8,18,36,.85);padding:56px 60px;box-shadow:0 0 60px rgba(94,231,255,.25);position:relative}
.box::before,.box::after{content:'';position:absolute;width:40px;height:40px;border:6px solid #5ee7ff}
.box::before{top:-10px;left:-10px;border-right:0;border-bottom:0}.box::after{bottom:-10px;right:-10px;border-left:0;border-top:0}
.p{font-weight:700;font-size:80px;line-height:1.15}
.p.long{font-size:64px;font-weight:600}
.small{font-weight:600;font-size:46px;color:#b8c8dc;letter-spacing:.06em;text-shadow:0 2px 16px rgba(0,0,0,.6)}
.num{position:absolute;right:90px;top:270px;font-weight:700;font-size:44px;letter-spacing:.2em;color:#7e93b0}
.swipe{position:absolute;left:0;right:0;bottom:330px;text-align:center;font-weight:700;font-size:46px;letter-spacing:.3em;color:#5ee7ff}
.brand{position:absolute;left:0;right:0;top:200px;text-align:center;font-weight:700;font-size:40px;letter-spacing:.5em;color:#8ea3c0}
.math{font-weight:700;font-size:136px;line-height:1;white-space:nowrap}
.red .kick{color:#ff8a8a;text-shadow:0 0 24px rgba(255,120,120,.5)} .red .box{border-color:rgba(255,138,138,.7)} .red .math{color:#ff8a8a}
.red .box::before,.red .box::after{border-color:#ff8a8a}
.gold .kick{color:#f5c451} .gold .box{border-color:rgba(245,196,81,.75)} .gold .box::before,.gold .box::after{border-color:#f5c451}
.alert .kick{color:#ff4d5e;text-shadow:0 0 30px rgba(255,60,80,.8)} .alert .box{border-color:#ff4d5e;box-shadow:0 0 70px rgba(255,60,80,.35)} .alert .box::before,.alert .box::after{border-color:#ff4d5e} .alert .h b{color:#ff4d5e;text-shadow:0 0 36px rgba(255,60,80,.8)}
.banner{position:absolute;left:0;right:0;top:300px;padding:22px 40px;background:#ff3b4e;color:#fff;text-align:center;font-weight:700;font-size:48px;letter-spacing:.14em;box-shadow:0 0 60px rgba(255,59,78,.6)}
.edge{position:absolute;left:0;right:0;height:12px;background:#ff3b4e;box-shadow:0 0 40px #ff3b4e}
.cd{font-weight:700;font-size:330px;line-height:.9;color:#ff4d5e;text-shadow:0 0 60px rgba(255,60,80,.7)}
/* whisper: the Pinterest "dream life" look, a full photo with one small word ("rich.", "God, please.") */
.whisper .grid,.whisper .scan,.whisper .brand{display:none}
.whisper #bg::after{background:linear-gradient(180deg,rgba(0,0,0,.08),rgba(0,0,0,.18) 60%,rgba(0,0,0,.35))}
.wh{position:absolute;left:80px;right:80px;text-align:center;font-family:'Liberation Serif','DejaVu Serif',Georgia,serif;font-size:58px;color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.55);letter-spacing:.01em}
.wh.sans{font-family:Raj,sans-serif;font-weight:600;font-size:60px}
/* essay: the "How to start your life again" carousel look. Full photo, a numbered heading and a short paragraph, left aligned. */
@font-face { font-family: Inter; src: url(fonts/inter-latin-400-normal.woff2); font-weight: 400; }
@font-face { font-family: Inter; src: url(fonts/inter-latin-600-normal.woff2); font-weight: 600; }
.essay .grid,.essay .brand{display:none}.essay .scan{opacity:.35}
.essay #bg::after{background:linear-gradient(180deg,rgba(0,0,0,.72) 0%,rgba(0,0,0,.55) 38%,rgba(0,0,0,.12) 62%,rgba(0,0,0,.35) 100%)}
.es{position:absolute;left:84px;right:150px;font-family:Inter,sans-serif;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.7)}
.es .tag{font-family:Raj,sans-serif;font-weight:700;font-size:30px;letter-spacing:.32em;color:#5ee7ff;text-shadow:0 0 18px rgba(94,231,255,.6);margin-bottom:22px}
.es h2{margin:0 0 34px;font-weight:600;font-size:62px;line-height:1.1;letter-spacing:-.01em}
.es h2 i{font-style:normal;color:#5ee7ff;margin-right:14px}
.es p{margin:0 0 30px;font-weight:400;font-size:40px;line-height:1.32}
.es p.last{font-weight:600;color:#f5c451}
.es .xp{display:flex;align-items:center;gap:18px;margin-top:10px;font-family:Raj,sans-serif;font-weight:700;font-size:30px;letter-spacing:.2em;color:#5ee7ff}
.es .xp span{flex:0 0 220px;height:8px;background:rgba(94,231,255,.2);border-radius:4px;overflow:hidden}.es .xp span b{display:block;height:100%;background:#5ee7ff;box-shadow:0 0 12px #5ee7ff}
.es.center{text-align:center;left:90px;right:90px}
.es.center h2{font-size:58px}
.logo{background:#000 !important}.logo .grid,.logo .brand,.logo .scan{display:none}
.lg{position:absolute;left:0;right:0;top:50%;transform:translateY(-55%);text-align:center;font-family:Raj,sans-serif;font-weight:700;color:#fff}
.lg .mk{position:relative;width:170px;height:170px;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:118px;line-height:1;color:#5ee7ff;text-shadow:0 0 30px rgba(94,231,255,.7)}
.lg .mk::before{content:'';position:absolute;inset:14px;border:6px solid #5ee7ff;transform:rotate(45deg);box-shadow:0 0 40px rgba(94,231,255,.35),inset 0 0 30px rgba(94,231,255,.2)}
.lg .nm{margin-top:90px;font-size:128px;letter-spacing:.18em;padding-left:.18em}
.lg .ln{width:90px;height:6px;background:#5ee7ff;margin:34px auto 0;box-shadow:0 0 16px #5ee7ff}
.lg .sb{margin-top:34px;font-size:40px;letter-spacing:.5em;padding-left:.5em;color:#f5c451}
.whcap{position:absolute;left:0;right:0;bottom:250px;text-align:center;font-family:Raj,sans-serif;font-weight:700;font-size:34px;letter-spacing:.42em;color:rgba(255,255,255,.85);text-shadow:0 2px 12px rgba(0,0,0,.6)}
</style></head><body><div id="s"><div id="bg"></div><div class="grid"></div><div class="brand">THE SYSTEM</div><div id="c"></div><div class="scan"></div></div>
<script>
const esc = (x) => x ?? '';
window.show = async (sl) => {
  const s = document.getElementById('s'), bg = document.getElementById('bg');
  s.className = sl.bg ? 'photo' : '';
  if (sl.bg) { bg.style.display = 'block'; bg.style.backgroundImage = `url("${sl.bg}")`; await new Promise((r) => { const i = new Image(); i.onload = i.onerror = r; i.src = sl.bg; }); } else bg.style.display = 'none';
  const tone = sl.tone ? ` ${sl.tone}` : '';
  let h = '';
  if (sl.kind === 'cover') h = `<div class="wrap${tone}"><div class="kick">[ ${esc(sl.kick)} ]</div><div class="h">${esc(sl.title)}</div>${sl.sub ? `<div class="small">${sl.sub}</div>` : ''}</div><div class="swipe">SWIPE →</div>`;
  if (sl.kind === 'point') h = `${sl.num ? `<div class="num">${sl.num}</div>` : ''}<div class="wrap${tone}"><div class="kick">[ ${esc(sl.kick)} ]</div><div class="box"><div class="p${(sl.text || '').replace(/<[^>]+>/g, '').length > 60 ? ' long' : ''}">${esc(sl.text)}</div></div>${sl.sub ? `<div class="small">${sl.sub}</div>` : ''}</div>`;
  if (sl.kind === 'math') h = `<div class="wrap${tone}"><div class="kick">[ ${esc(sl.kick)} ]</div><div class="math c">${esc(sl.big)}</div><div class="box"><div class="p long">${esc(sl.text)}</div></div></div>`;
  if (sl.kind === 'whisper') { s.className = 'photo whisper'; h = `<div class="wh${sl.font === 'sans' ? ' sans' : ''}" style="top:${sl.y ?? 34}%">${esc(sl.text)}</div>${sl.cap ? `<div class="whcap">${sl.cap}</div>` : ''}`; }
  // essay: { bg, num: '02', title: 'Own it & let go', paras: ['...','...'], last: 'Write it down. Move on.', tag?: 'QUEST 02', xp?: 40, y?: 13 (% from top), center?: true }
  if (sl.kind === 'essay') { s.className = 'photo essay'; h = `<div class="es${sl.center ? ' center' : ''}" style="top:${sl.y ?? 13}%">${sl.tag ? `<div class="tag">[ ${sl.tag} ]</div>` : ''}${sl.title ? `<h2>${sl.num ? `<i>${sl.num}</i>` : ''}${sl.title}</h2>` : ''}${(sl.paras || []).map((p) => `<p>${p}</p>`).join('')}${sl.last ? `<p class="last">${sl.last}</p>` : ''}${sl.xp ? `<div class="xp">+${sl.xp} XP <span><b style="width:${Math.min(100, sl.xp)}%"></b></span></div>` : ''}</div>`; }
  // logo: the brand end card on plain black (the "Minimalism." carousel ends this way). { sub?: 'COMING SOON' }
  if (sl.kind === 'logo') { s.className = 'logo'; h = `<div class="lg"><div class="mk">S</div><div class="nm">THE SYSTEM</div><div class="ln"></div><div class="sb">${esc(sl.sub || 'COMING SOON')}</div></div>`; }
  if (sl.kind === 'countdown') h =`<div class="wrap alert"><div class="kick">[ ${esc(sl.kick || 'TIME LEFT')} ]</div><div class="cd">${esc(sl.big)}</div><div class="h" style="font-size:96px">${esc(sl.title)}</div>${sl.sub ? `<div class="small">${sl.sub}</div>` : ''}</div>`;
  if (sl.kind === 'cta') h =`<div class="wrap${tone}"><div class="h">${esc(sl.title)}</div><div class="box"><div class="p long">${esc(sl.text)}</div></div><div class="small">${esc(sl.sub || 'FOLLOW TO JOIN THE WAITLIST')}</div></div>`;
  // Urgency: a red banner across the top (sl.banner) and red edge bars on alert slides.
  if (sl.banner) h = `<div class="banner">⚠ ${sl.banner} ⚠</div>` + h.replace('class="wrap', 'style="top:420px" class="wrap');
  if (sl.tone === 'alert' || sl.kind === 'countdown') h += '<div class="edge" style="top:0"></div><div class="edge" style="bottom:0"></div>';
  document.getElementById('c').innerHTML = h;
  await document.fonts.ready;
};
</script></body></html>
